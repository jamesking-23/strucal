name: Desktop release
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "crates/engine/**", "installer/**", "Cargo.toml", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: cargo test -p strucal-engine
      - name: Build desktop
        env:
          STRUCAL_VERSION: 0.1.${{ github.run_number }}
        run: cargo build -p strucal-desktop --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=0.1.${{ github.run_number }} installer\strucal.iss
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" dist/StruCal-Setup-x64.exe \
            --title "StruCal Desktop 0.1.${{ github.run_number }}" \
            --notes "Preview build from commit ${GITHUB_SHA::7}. Install once with StruCal-Setup-x64.exe; afterwards use Settings > Check updates in the app."
